# Ambiente de desenvolvimento: só o banco roda em container.
# Backend e frontend rodam localmente com `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gve}
      POSTGRES_DB: ${POSTGRES_DB:-gve}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
