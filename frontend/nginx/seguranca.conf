# Cabeçalhos de segurança. Incluído em cada location, porque add_header
# de um location apaga os herdados do server.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# O HTTPS termina no Caddy do servidor; o navegador guarda o HSTS da resposta que recebe por HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
