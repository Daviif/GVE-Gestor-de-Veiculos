# Nginx interno do GVE: serve o frontend e repassa /api para a API.
# Quem fala com a internet é o Caddy do servidor (80/443), que repassa para esta porta.

# IP real do cliente: o Caddy manda o IP em X-Forwarded-For; só confiamos nele
# quando a conexão vem do próprio host / gateway do Docker.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # DNS interno do Docker; a variável evita que o Nginx caia na subida se a API ainda não existir.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api http://api:3333;
        proxy_pass $api;
        proxy_set_header Host $host;
        # Sobrescreve (não acrescenta): a API não pode confiar num X-Forwarded-For forjado pelo cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-store" always;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/seguranca.conf;
        try_files $uri =404;
    }

    # SPA: qualquer outra rota cai no index.html, que nunca fica em cache.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/seguranca.conf;
        try_files $uri /index.html;
    }
}
